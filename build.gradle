plugins {
  id 'java'
  id 'org.springframework.boot' version '3.3.0'
  id 'io.spring.dependency-management' version '1.1.5'
  // id 'org.graalvm.buildtools.native' version '0.10.2'
  // id 'org.cyclonedx.bom' version '1.8.2'
  // id 'io.spring.javaformat' version '0.0.41'
  // id "io.spring.nohttp" version "0.0.11"
  id 'org.owasp.dependencycheck' version '9.0.9'
}

apply plugin: 'java'
apply plugin: 'checkstyle'
// apply plugin: 'io.spring.javaformat'

// gradle.startParameter.excludedTaskNames += [ "checkFormatAot", "checkFormatAotTest" ]

group = 'org.springframework.samples'
version = '3.3.0'

java {
  sourceCompatibility = JavaVersion.VERSION_17
}

repositories {
  // Use mirror if configured, with retry logic
  def mavenMirrorUrl = System.getenv('MAVEN_MIRROR_URL')
  if (mavenMirrorUrl) {
    maven {
      url mavenMirrorUrl
      allowInsecureProtocol = mavenMirrorUrl.startsWith('http://')
    }
  }

  // Google's Maven Central mirror (higher rate limits)
  maven {
    url 'https://maven-central-eu.storage-download.googleapis.com/maven2/'
    name 'Google Maven Central EU'
  }

  mavenCentral() {
    // Fallback to original Maven Central
    content {
      // Allow all artifacts from Maven Central
    }
  }

  // Fallback to local cache
  mavenLocal()
}

// Add retry logic for dependency resolution
configurations.all {
  resolutionStrategy {
    cacheChangingModulesFor 4, 'hours'
    cacheDynamicVersionsFor 10, 'minutes'
  }
}

ext.webjarsFontawesomeVersion = "4.7.0"
ext.webjarsBootstrapVersion = "5.3.3"

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-cache'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'javax.cache:cache-api'
  implementation 'jakarta.xml.bind:jakarta.xml.bind-api'
  runtimeOnly 'org.springframework.boot:spring-boot-starter-actuator'
  runtimeOnly "org.webjars.npm:bootstrap:${webjarsBootstrapVersion}"
  runtimeOnly "org.webjars.npm:font-awesome:${webjarsFontawesomeVersion}"
  runtimeOnly 'com.github.ben-manes.caffeine:caffeine'
  runtimeOnly 'com.h2database:h2'
  runtimeOnly 'com.mysql:mysql-connector-j'
  runtimeOnly 'org.postgresql:postgresql'
  developmentOnly 'org.springframework.boot:spring-boot-devtools'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.boot:spring-boot-testcontainers'
  testImplementation 'org.springframework.boot:spring-boot-docker-compose'
  testImplementation 'org.testcontainers:junit-jupiter'
  testImplementation 'org.testcontainers:mysql'
  checkstyle 'io.spring.javaformat:spring-javaformat-checkstyle:0.0.41'
  checkstyle 'com.puppycrawl.tools:checkstyle:10.16.0'
}

tasks.named('test') {
  useJUnitPlatform()
}

checkstyle {
  configDirectory = project.file('src/checkstyle')
  configFile = file('src/checkstyle/nohttp-checkstyle.xml')
}

